name: Docker Compose Dev Deployment

on:
  push:
    branches:
      - dev

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPO_TM_CORE }}

jobs:
  build-and-push-image:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Compute image tag
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy-to-dev-with-docker:
    name: Deploy to DEV (Docker Compose)
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (docker-compose deployment)
        uses: appleboy/ssh-action@v0.1.6
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO_TM_CORE }}
          SHORT_SHA: ${{ needs.build-and-push-image.outputs.short_sha }}
        with:
          host: ${{ secrets.HOST_DEV }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY_PRIVATE_DEV }}
          envs: AWS_REGION,AWS_ACCOUNT_ID,ECR_REPOSITORY,SHORT_SHA
          script: |
            set -euo pipefail
            cd /opt/tm-docker

            REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

            echo "Logging into ECR..."
            aws ecr get-login-password --region "${AWS_REGION}" | \
              docker login --username AWS --password-stdin "${REGISTRY}"

            OLD_TAG=$(grep '^IMAGE_TAG_CORE=' .env | cut -d= -f2)
            echo "Previous: ${OLD_TAG} → New: ${SHORT_SHA}"

            sed -i "s|^IMAGE_TAG_CORE=.*|IMAGE_TAG_CORE=${SHORT_SHA}|" .env
            docker compose pull tm-core
            docker compose up -d tm-core

            echo "Waiting for health check..."
            HEALTHY=false
            for i in {1..60}; do
              if docker inspect --format='{{.State.Health.Status}}' tm-core-dkr-dev 2>/dev/null | grep -q "healthy"; then
                echo "✅ Container healthy (${i}s)"
                HEALTHY=true
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "❌ Health check failed. Rolling back to ${OLD_TAG}..."
              sed -i "s|^IMAGE_TAG_CORE=.*|IMAGE_TAG_CORE=${OLD_TAG}|" .env
              docker compose pull tm-core
              docker compose up -d tm-core

              for i in {1..30}; do
                if docker inspect --format='{{.State.Health.Status}}' tm-core-dkr-dev 2>/dev/null | grep -q "healthy"; then
                  echo "✅ Rollback successful"
                  break
                fi
                sleep 2
              done

              echo "❌ Deployment failed, rolled back to ${OLD_TAG}"
              exit 1
            fi

            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

            echo "Cleaning up old images..."
            docker images --format "{{.ID}}\t{{.Repository}}:{{.Tag}}" | \
              grep "tm-core-repo" | \
              grep -v "${SHORT_SHA}" | \
              grep -v "${OLD_TAG}" | \
              awk '{print $1}' | \
              xargs -r docker rmi -f 2>/dev/null || true
            echo "Cleanup complete"
